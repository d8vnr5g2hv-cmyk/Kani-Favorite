<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Kani Favorite デモ3</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --teal:#20999C; --tabH:64px; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:#000; font-family:'Noto Sans JP',sans-serif; overflow:hidden; color:#fff; }

  /* ===== メモロビ ===== */
  #lobby { position:fixed; inset:0; }
  .slides { display:flex; height:100%; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; }
  .slides::-webkit-scrollbar { display:none; }
  .slide { flex:0 0 100%; height:100%; scroll-snap-align:center; position:relative; overflow:hidden; background:#111; }
  .slide canvas.blur { position:absolute; inset:-10%; width:120%; height:120%; filter:blur(24px) brightness(.75); object-fit:cover; }
  .slide video { position:absolute; inset:0; width:100%; height:100%; }
  .ph { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
        color:rgba(255,255,255,.85); font-size:15px; text-align:center; line-height:1.8; }

  /* 表示モード */
  body.m-fit   .slide video { object-fit:contain; }
  .slide.tall video { object-fit:cover; }
  .slide.tall canvas.blur { display:none; }

  /* 横持ちモード：ロビー全体を90度回転して原寸表示 */
  body.m-land #lobby { width:100vh; height:100vw; inset:auto; top:0; left:100vw;
                       transform-origin:0 0; transform:rotate(90deg); }
  body.m-land .slides { overflow-x:hidden; }
  body.m-land .slide video { object-fit:cover; }
  body.m-land .slide canvas.blur { display:none; }
  body.m-land .tabs, body.m-land .dots, body.m-land .modebar, body.m-land .banner { display:none; }
  body.m-land .voiceBtn { display:none; }
  @media (orientation:landscape) {
    /* 端末を実際に横にした場合は回転不要 */
    body.m-land #lobby { width:100vw; height:100vh; left:0; transform:none; }
  }
  .landUI { display:none; position:absolute; inset:0; pointer-events:none; }
  body.m-land .landUI { display:block; }
  .landUI .name { position:absolute; top:16px; left:calc(env(safe-area-inset-top) + 20px); font-size:18px; font-weight:700;
                  text-shadow:0 1px 6px rgba(0,0,0,.5); }
  .landUI button { pointer-events:auto; position:absolute; border:none; font-family:inherit; }
  .landUI .back { top:14px; right:20px; background:rgba(0,0,0,.35); color:#fff; border-radius:16px; padding:6px 14px; font-size:12px; }
  .landUI .v { bottom:20px; right:24px; width:56px; height:56px; border-radius:50%; background:var(--teal); color:#fff; font-size:22px; }

  /* バナー */
  .banner { position:fixed; top:0; left:0; right:0; z-index:5;
            padding:calc(env(safe-area-inset-top) + 10px) 16px 18px;
            background:linear-gradient(rgba(0,0,0,.5),transparent);
            display:flex; justify-content:space-between; align-items:flex-start; pointer-events:none; }
  .banner .title { font-size:12px; letter-spacing:.1em; opacity:.85; }
  .banner .name { font-size:20px; font-weight:700; margin-top:2px; }
  .banner .greet { font-size:12px; opacity:.85; margin-top:2px; }
  .banner button { pointer-events:auto; background:rgba(255,255,255,.2); color:#fff; border:1px solid rgba(255,255,255,.4);
                   border-radius:16px; padding:6px 12px; font-size:12px; font-family:inherit; }

  /* モード切替（デモ用） */
  .modebar { position:fixed; left:12px; right:12px; z-index:6;
             bottom:calc(var(--tabH) + env(safe-area-inset-bottom) + 120px);
             display:flex; flex-direction:column; gap:6px; }
  .modebar .row { display:flex; gap:6px; }
  .modebar button { flex:1; padding:8px 4px; border-radius:10px; border:1px solid rgba(255,255,255,.35);
                    background:rgba(0,0,0,.35); color:#fff; font-size:12px; font-family:inherit; }
  .modebar button.on { background:var(--teal); border-color:var(--teal); font-weight:700; }
  .modebar .label { font-size:11px; opacity:.8; text-shadow:0 1px 4px #000; }

  .dots { position:fixed; left:0; right:0; bottom:calc(var(--tabH) + env(safe-area-inset-bottom) + 18px);
          display:flex; justify-content:center; gap:8px; z-index:5; pointer-events:none; }
  .dots span { width:7px; height:7px; border-radius:50%; background:rgba(255,255,255,.4); transition:.2s; }
  .dots span.on { background:#fff; width:18px; border-radius:4px; }

  .voiceBtn { position:fixed; right:16px; bottom:calc(var(--tabH) + env(safe-area-inset-bottom) + 44px);
              width:60px; height:60px; border-radius:50%; border:none; z-index:6;
              background:var(--teal); color:#fff; font-size:24px; box-shadow:0 4px 14px rgba(0,0,0,.3); }
  .voiceBtn:active { transform:scale(.92); }

  .page { position:fixed; inset:0; background:#fff; color:#333; z-index:4; display:none;
          padding:calc(env(safe-area-inset-top) + 20px) 16px calc(var(--tabH) + 100px); overflow-y:auto; }
  .page.show { display:block; }
  .page h2 { color:var(--teal); font-size:20px; margin-bottom:12px; }
  .page p { color:#555; font-size:14px; line-height:1.8; }

  .tabs { position:fixed; left:0; right:0; bottom:0; z-index:7; display:flex;
          height:calc(var(--tabH) + env(safe-area-inset-bottom)); padding-bottom:env(safe-area-inset-bottom);
          background:rgba(255,255,255,.92); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
          border-top:1px solid #e5e5e5; }
  .tabs.dark { background:rgba(0,0,0,.35); border-top-color:rgba(255,255,255,.15); }
  .tabs button { flex:1; border:none; background:none; font-family:inherit; font-size:11px; color:#999; }
  .tabs.dark button { color:rgba(255,255,255,.6); }
  .tabs button.on { color:var(--teal); font-weight:700; }
  .tabs.dark button.on { color:#fff; }
  .tabs .ic { display:block; font-size:20px; margin-bottom:2px; }

  .toast { position:fixed; left:50%; top:40%; transform:translate(-50%,-50%); z-index:9;
           background:rgba(0,0,0,.7); color:#fff; padding:10px 18px; border-radius:20px; font-size:13px;
           opacity:0; transition:opacity .2s; pointer-events:none; white-space:nowrap; }
  .toast.show { opacity:1; }
  input[type=file] { display:none; }
</style>
</head>
<body class="m-fit">

<div id="lobby">
  <div class="slides" id="slides"></div>
  <div class="landUI">
    <div class="name" id="landName"></div>
    <button class="back" id="landBack">縦に戻す</button>
    <button class="v" id="landVoice">🔊</button>
  </div>
</div>

<div class="banner" id="banner">
  <div>
    <div class="title">KANI FAVORITE</div>
    <div class="name" id="charName">キャラ1</div>
    <div class="greet" id="greet"></div>
  </div>
  <button id="loadBtn">素材を入れる</button>
</div>

<div class="modebar" id="modebar">
  <div class="label">表示（デモ用・比較して決める）</div>
  <div class="row">
    <button data-mode="m-fit" class="on">縦</button>
    <button data-mode="m-land">横持ち</button>
  </div>
</div>

<div class="dots" id="dots"></div>

<div class="page" id="page-todo"><h2>Todo</h2><p>やること・考えること（デモでは中身なし）</p></div>
<div class="page" id="page-love"><h2>Love</h2><p>好きなもの約30カテゴリ（デモでは中身なし）</p></div>
<div class="page" id="page-accounts"><h2>Accounts</h2><p>アカウント管理（デモでは中身なし）</p></div>
<div class="page" id="page-profile"><h2>Profile</h2><p>プロフィール（デモでは中身なし）</p></div>

<button class="voiceBtn" id="voiceBtn">🔊</button>

<nav class="tabs dark" id="tabs">
  <button data-tab="todo"><span class="ic">✓</span>Todo</button>
  <button data-tab="love"><span class="ic">♡</span>Love</button>
  <button data-tab="favorite" class="on"><span class="ic">★</span>Favorite</button>
  <button data-tab="accounts"><span class="ic">🔑</span>Accounts</button>
  <button data-tab="profile"><span class="ic">👤</span>Profile</button>
</nav>

<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="video/*,audio/*" multiple>

<script>
// キャラ1には同じフォルダの動画を最初から入れておく
const chars = [
  { name:'キャラ1', tall:'lobby_tall_h264.mp4', tallPoster:'lobby_tall_poster.jpg', wide:'lobby_h264.mp4', widePoster:'lobby_poster.jpg' },
  { name:'キャラ2' }, { name:'キャラ3' }, { name:'キャラ4' },
];
chars.forEach(c => { c.voices = []; });

const $ = id => document.getElementById(id);
const slidesEl = $('slides'), dotsEl = $('dots');
let current = 0, codec = 'h264';

// ===== スライド生成 =====
chars.forEach((c, i) => {
  const s = document.createElement('div');
  s.className = 'slide';
  s.style.setProperty('--fx', c.fx || '50%');
  s.addEventListener('click', () => playVoice('tap'));
  slidesEl.appendChild(s);
  dotsEl.appendChild(document.createElement('span'));
  if (c.tall || c.wide) loadChar(i);
  else s.innerHTML = `<div class="ph">${c.name}<br>（「素材を入れる」で動画を追加）</div>`;
});

// 縦表示：縦長動画があれば一面、なければ横動画＋ぼかし背景／横持ち：横動画
function loadChar(i) {
  const c = chars[i], land = document.body.classList.contains('m-land');
  const useTall = !land && c.tall;
  slidesEl.children[i].classList.toggle('tall', !!useTall);
  if (useTall) setVideo(i, c.tall, c.tallPoster);
  else if (c.wide) setVideo(i, c.wide, c.widePoster);
  else if (c.tall) { slidesEl.children[i].classList.add('tall'); setVideo(i, c.tall, c.tallPoster); }
}

function setVideo(i, url, poster) {
  const s = slidesEl.children[i];
  s.innerHTML = '';
  const cv = document.createElement('canvas'); cv.className = 'blur'; cv.width = 48; cv.height = 96;
  const v = document.createElement('video');
  v.muted = true; v.loop = true; v.playsInline = true; v.autoplay = true; v.preload = 'auto';
  v.setAttribute('playsinline', ''); v.setAttribute('muted', '');
  if (poster) v.poster = poster;
  v.src = url;
  // ぼかし背景：1コマを小さなキャンバスに描いてCSSでぼかす（動画を2本再生しないので軽い）
  const paint = src => { try { cv.getContext('2d').drawImage(src, 0, 0, cv.width, cv.height); } catch(e) {} };
  if (poster) { const im = new Image(); im.onload = () => paint(im); im.src = poster; }
  v.addEventListener('loadeddata', () => paint(v), { once:true });
  v.addEventListener('error', () => toast('動画を読み込めませんでした（同じフォルダにありますか？）'));
  s.append(cv, v);
  if (i === current) v.play().catch(()=>{});
}

slidesEl.addEventListener('scroll', () => {
  const i = Math.round(slidesEl.scrollLeft / slidesEl.clientWidth);
  if (i !== current) { current = i; updateUI(); }
});

function updateUI() {
  $('charName').textContent = $('landName').textContent = chars[current].name;
  [...dotsEl.children].forEach((d, i) => d.classList.toggle('on', i === current));
  [...slidesEl.children].forEach((s, i) => {
    const v = s.querySelector('video');
    if (v) i === current ? v.play().catch(()=>{}) : v.pause();
  });
}

// ===== 表示モード・画質切替 =====
$('modebar').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.mode) {
    document.body.classList.remove('m-fit','m-cover','m-land');
    document.body.classList.add(b.dataset.mode);
    b.parentNode.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
    chars.forEach((c, i) => { if (c.tall || c.wide) loadChar(i); });
    slidesEl.scrollLeft = slidesEl.clientWidth * current;
  }
});
$('landBack').addEventListener('click', e => {
  e.stopPropagation();
  $('modebar').querySelector('[data-mode="m-fit"]').click();
});
$('landVoice').addEventListener('click', e => { e.stopPropagation(); playVoice('button'); });

// ===== 時間帯・ボイス =====
function scene() {
  const h = new Date().getHours();
  if (h >= 5 && h < 11) return ['morning', 'おはよう'];
  if (h >= 11 && h < 17) return ['noon', 'こんにちは'];
  if (h >= 17 && h < 23) return ['night', 'お疲れさま'];
  return ['late', 'もう遅い時間'];
}
$('greet').textContent = scene()[1];

const audio = new Audio();
function playVoice(kind) {
  const list = chars[current].voices;
  if (list.length) {
    audio.src = list[Math.floor(Math.random() * list.length)];
    audio.play();
    toast(`${chars[current].name}：再生中`);
  } else {
    toast(`${chars[current].name}：${kind === 'tap' ? 'タップ' : 'ボタン'}ボイス（${scene()[0]}）`);
  }
}
$('voiceBtn').addEventListener('click', () => playVoice('button'));

function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1600);
}

// ===== 素材の読み込み（表示中のキャラに入る） =====
const fileIn = $('fileIn');
$('loadBtn').addEventListener('click', () => fileIn.click());
fileIn.addEventListener('change', () => {
  [...fileIn.files].forEach(f => {
    const url = URL.createObjectURL(f);
    if (f.type.startsWith('video')) { const c = chars[current]; slidesEl.children[current].classList.remove('tall'); c.tall = null; c.wide = url; c.widePoster = null; setVideo(current, url); }
    else if (f.type.startsWith('audio')) chars[current].voices.push(url);
  });
  toast(`${chars[current].name}に素材を追加しました`);
  fileIn.value = '';
});

// ===== タブ =====
const tabs = $('tabs');
tabs.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  [...tabs.children].forEach(x => x.classList.toggle('on', x === b));
  const tab = b.dataset.tab;
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('show', p.id === 'page-' + tab));
  const isLobby = tab === 'favorite';
  tabs.classList.toggle('dark', isLobby);
  ['banner','modebar'].forEach(id => $(id).style.display = isLobby ? '' : 'none');
  dotsEl.style.display = isLobby ? '' : 'none';
});

updateUI();
</script>
</body>
</html>
